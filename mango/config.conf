# windows effect
blur=10
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

windowrule=isfloating:1,appid:sdl-creation
# firefox is transparent (floating pill tabs): no shadow or blur behind it, so the wallpaper shows through cleanly
windowrule=isnoshadow:1,noblur:1,appid:firefox



shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=5
shadows_blur=15
shadows_position_x=5
shadows_position_y=5
shadowscolor=0x2d2d2dff

border_radius=24
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1

scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
inhibit_regardless_of_visibility=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

mouse_natural_scrolling=0



exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=wlroots
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/xdg-desktop-portal-wlr & 
exec=sh -c '~/dotfiles/.config/mango/wallpaper.sh'
exec=sh -c '~/dotfiles/.config/mango/bar.sh'

gappih=20
gappiv=20
gappoh=50
gappov=50
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=0
rootcolor=0x201b14ff
bordercolor=0x0c0c0cff
focuscolor=0xE8E8E8ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0xffffffff

dropcolor=0x00000000
splitcolor=0xEB441EFF
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle

tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile
monitorrule=name:^DP-1$,width:1920,height:1080,refresh:144,x:0,y:0,scale:1
monitorrule=name:^DP-2$,width:2560,height:1440,refresh:180,x:1920,y:0,scale:1
monitorrule=name:^DP-3$,width:1920,height:1080,refresh:144,x:4480,y:0,scale:1

mousebind=SUPER,btn_left,moveresize,curmove



source=~/.config/mango/bind.conf
