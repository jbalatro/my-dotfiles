# fonts

font-family family="JetBrains Mono"

window_padding_width 24
background_blur 2
confirm_os_window_close -1

# colors: dark by default; mango's wallpaper.sh copies the active theme to
# ~/.cache/happybar/kitty-theme.conf and reloads kitty, so it follows the wallpaper
include themes/dark.conf
include ~/.cache/happybar/kitty-theme.conf
