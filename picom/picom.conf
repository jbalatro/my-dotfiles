## Shadows ##

shadow = true;
shadow-radius = 19;
shadow-offset-x = -15;
shadow-offset-y = -9;

## Fading ##
fading = false;
fade-in-step = 0.03;
fade-delta = 5
fade-out-step = 0.03;
no-fading-openclose = false
no-fading-destroyed-argb = false

animations = (
{
    triggers = ["close"];
    opacity = {
        curve = "cubic-bezier(0,1,1,1)";
        duration = 0.3;
        start = "window-raw-opacity-before";
        end = 0;
    };

    blur-opacity = "opacity";
    shadow-opacity = "opacity";

    scale-x = {
        curve = "cubic-bezier(0,1.3,1,1)";
        duration = 0.3;
        start = 1;
        end = 0.6;
    };
    scale-y = "scale-x";

    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
},
{
    triggers = ["open"];
    scale = 0.0;

    opacity = {
        curve = "cubic-bezier(0,1,1,1)";
        duration = 0.25;
        start = 0;
        end = "window-raw-opacity";
    };

    scale-x = {
        curve = "cubic-bezier(0,1.3,1,1)";
        duration = 0.25;
        start = 0.6;
        end = 1;
    };
    scale-y = "scale-x";

    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";

    shadow-opacity = "opacity"
    blur-opacity = "opacity"
},
{
    var-animation-speed = 0.25
    triggers = ["geometry"];
    scale-x = {
        curve = "cubic-bezier(0,0,0,1.64)";
        duration = "var-animation-speed";
        start = "window-width-before / window-width";
        end = 1;
    };

    scale-y = {
        curve = "cubic-bezier(0,0,0,1.64)";
        duration = "var-animation-speed";
        start = "window-height-before / window-height";
        end = 1;
    };

    scale-x-reverse = {
        curve = "cubic-bezier(0,0,0,1.64)";
        duration = "var-animation-speed";
        start = "window-width / window-width-before"
        end = 1;
    };

    scale-y-reverse = {
        curve = "cubic-bezier(0,0,0,1.64)";
        duration = "var-animation-speed";
        start = "window-height-before / window-height";
        end = 1;
    };

    offset-x = {
        curve = "cubic-bezier(0,0,0,1.64)";
        duration = "var-animation-speed";
        start = "window-x-before - window-x";
        end = 0;
    };

    offset-y = {
        curve = "cubic-bezier(0,0,0,1.64)";
        duration = "var-animation-speed";
        start = "window-y-before - window-y";
        end = 0;
    };

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";

    
},
{
    triggers = ["decrease-opacity", "increase-opacity"];
    opacity = {
        duration = 0.10;
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    }
}
)

#################################
#   Transparency / Opacity      #
#################################

# Opacity of window titlebars and borders.
#
# Range: 0.1 - 1.0
# Default: 1.0 (disabled)
frame-opacity = 0.9;

# Use fixed inactive dim value, instead of adjusting according to window opacity.
#
# Default: false
# inactive-dim-fixed = true

#################################
#           Corners             #
#################################

# Sets the radius of rounded window corners. When > 0, the compositor will
# round the corners of windows. Does not interact well with
# `transparent-clipping`.
#
# Default: 0 (disabled)
corner-radius = 28
#################################
#            Blur               #
#################################

blur-kern = "3x3box";
backend = "glx"
dithered-present = false;
vsync = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.75;
  full-shadow = false;
},
{
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
}, {
  match = "window_type != 'dock'";
  # shader = "my_shader.frag";
}, {
  match = "window_type = 'dock' || "
          "window_type = 'desktop'";
  corner-radius = 0;
}, {
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
})

rules: (
{
    match = "!focused";
    opacity = 0.9;
    blur-background = true;
},
{
	match = "fullscreen ";
	corner-radius=0;
},
{
	match = "class_g = 'Polybar'";
  opacity = 1;
	shadow-radius = 1;
	shadow-offset-y = -15;
},
{
	match = "class_g = 'Alacritty' && !focused";
	opacity = 0.7;
},
{
  match = "class_g = 'firefox' && focused";
	opacity = 1;
  blur-background = true;
  shadow = true
},
{
  match = "class_g = 'Dunst'";
	opacity = 1;
  blur-background = false;
  shadow = false;
},
{
  match = "class_g = 'firefox' && fullscreen";
	opacity = 1;
  blur-background = true;
  shadow = false;
},
{
  match = "name = 'Eww - a_setting_closer'";
  opacity = 0;
  blur-background = false;
  shadow = false;
},
{
	match = "class_g = 'Alacritty' && focused";
	opacity = 0.9;
},
{
	match = "class_g = 'Rofi'";
	opacity: 0.6;
})

blur-background = true;
blur-method="dual_kawase";
blur-strength=8;

