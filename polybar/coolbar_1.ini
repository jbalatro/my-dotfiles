[bar/bar1]
monitor =
offset-y = 8
offset-x = 1.5%
height = 30
width = 15%

wm-restack = bspwm

background = ${colors.bgd}
foreground = ${colors.fg}

line-size = 2pt

padding-left = 2
padding-right = 2

module-margin = 1

include-file = $HOME/.config/polybar/fonts.ini
include-file = $HOME/.config/polybar/modules_bar_1.ini

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
