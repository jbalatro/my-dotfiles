[module/memory]
type = internal/memory
interval = 2

label = %{T0}%percentage%%%{T-}
label-foreground = ${colors.fg}
label-padding = 1

format = <label>
format-underline = ${colors.lpurple}
format-prefix = %{T1}%{T-}
format-prefix-background = ${colors.lpurple}
format-prefix-foreground = ${colors.bg}
format-prefix-padding = 1
