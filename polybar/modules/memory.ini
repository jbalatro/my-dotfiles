[module/memory]
type = internal/memory
interval = 2

label = %{T0}%percentage_used%%%{T-}
label-foreground = ${colors.fg}
label-padding = 1

format = <label>
format-underline = ${colors.lblue}
format-prefix = %{T1}%{T-}
format-prefix-background = ${colors.lblue}
format-prefix-foreground = ${colors.fg}
