[module/date]
type = internal/date
interval = 1

time = %H:%M


label = %{T0}%time%%{T-}
label-foreground = ${colors.fg}
label-padding = 1

format = <label>
format-underline = ${colors.lyellow}
format-prefix-background = ${colors.lyellow}
format-prefix-foreground = ${colors.bg}
format-prefix-padding = 1
